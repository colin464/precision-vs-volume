<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080c">
<title>Precision vs. Volume</title>
<style>
  :root {
    --bg:        #07080c;   /* cabinet black */
    --field:     #0b0f14;   /* inside the screen */
    --grid:      #131a22;
    --amber:     #ffc247;
    --green:     #46e07a;
    --cyan:      #8be9ff;
    --precision: #ff2b3d;   /* bright red — sharp, engineered */
    --volume:    #b44cff;   /* bright purple — bubbly, cheap */
    --dim:       #4e5a68;
    --bone:      #c9d4e0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--amber);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    position: fixed;
    inset: 0;
  }

  #stage {
    position: absolute;
    inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: block;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;          /* no scroll, no pinch-zoom, no double-tap zoom */
    image-rendering: pixelated;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="screen"></canvas></div>

  <script src="game.js"></script>
  <script>
  (function () {
    'use strict';

    /* ======================================================================
       PHASE 5 — SPAM LIKELY.
       Invader grid, both character shot models, and the blocker that drops in
       front of VOLUME and eats everything it fires.

       This file is the RENDERER and the SHELL only. All game rules live in
       game.js so the headless tuning harness runs identical logic.
       ====================================================================== */

    var W = PVV.WORLD.w, H = PVV.WORLD.h;
    var STEP = PVV.STEP;
    var CI = PVV.CONFIG.invaders;

    /* ---- URL params: ?seed=123 for a reproducible run, ?char= to preview --- */
    var params = new URLSearchParams(location.search);
    var seedParam = params.get('seed');
    var charParam = params.get('char') === 'volume' ? 'volume' : 'precision';

    var game, seedLabel;

    function newRound() {
      var seed = seedParam != null ? seedParam : String(Date.now());
      seedLabel = String(seed);
      game = PVV.createGame({ character: charParam, seed: seed });
    }
    newRound();

    /* ======================================================================
       CANVAS + DEVICE PIXEL RATIO
       ====================================================================== */
    var canvas = document.getElementById('screen');
    var ctx = canvas.getContext('2d', { alpha: false });

    var view = { scale: 1, offX: 0, offY: 0, cssW: 0, cssH: 0, dpr: 1 };

    function resize() {
      var rect = canvas.getBoundingClientRect();
      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      var cssW = Math.max(1, Math.round(rect.width));
      var cssH = Math.max(1, Math.round(rect.height));

      canvas.width  = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      // Letterbox the fixed logical playfield inside whatever space we have.
      var scale = Math.min(cssW / W, cssH / H);
      view.scale = scale;
      view.offX = (cssW - W * scale) / 2;
      view.offY = (cssH - H * scale) / 2;
      view.cssW = cssW; view.cssH = cssH; view.dpr = dpr;
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    resize();

    function toWorldX(clientX) {
      var rect = canvas.getBoundingClientRect();
      return (clientX - rect.left - view.offX) / view.scale;
    }

    /* ======================================================================
       INPUT — Pointer Events only. One code path for touch, pen and mouse.
       ====================================================================== */
    var pointerActive = false;
    var activePointerId = null;

    function handleTap() {
      // Temporary until Phase 6 puts a real end screen in.
      if (game.state.phase !== 'playing') newRound();
    }

    canvas.addEventListener('pointerdown', function (e) {
      pointerActive = true;
      activePointerId = e.pointerId;
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      handleTap();
      game.setTargetX(toWorldX(e.clientX));
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('pointermove', function (e) {
      if (pointerActive && e.pointerId === activePointerId) {
        game.setTargetX(toWorldX(e.clientX));
      } else if (e.pointerType === 'mouse') {
        game.setTargetX(toWorldX(e.clientX));   // desktop: follow the mouse
      }
      e.preventDefault();
    }, { passive: false });

    function endPointer(e) {
      if (e.pointerId === activePointerId) { pointerActive = false; activePointerId = null; }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    /* Desktop convenience only — the game is designed for drag. */
    var keyLeft = false, keyRight = false;
    var KEY_SPEED = 320;
    window.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keyLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = true;
      if (e.key === ' ' || e.key === 'Enter') handleTap();
    });
    window.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keyLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = false;
    });

    /* Belt and braces against mobile browser gestures. */
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
      document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    /* ======================================================================
       PIXEL SPRITES — 11 x 8 cells
       ====================================================================== */
    // PRECISION — a sharp, symmetrical dart. Reads as engineered.
    var SHIP_PRECISION = [
      '.....X.....',
      '....XXX....',
      '....XXX....',
      '...XXXXX...',
      '..XXXXXXX..',
      '.XXXXXXXXX.',
      'XX.XXXXX.XX',
      'X...XXX...X'
    ];

    // VOLUME — a bulbous, slightly lopsided blob. Reads as cheap.
    var SHIP_VOLUME = [
      '...XX.XX...',
      '..XXXXXXX..',
      '.XXXXXXXXXX',
      'XXXXXXXXXXX',
      'XXXXXXXXXXX',
      '.XXXXXXXXX.',
      '..XX.X.XX..',
      '..X.....X..'
    ];

    // Invaders: three families, two animation frames each. The formation
    // flips frame on every march step, which is what gives the classic waddle.
    var INVADERS = [
      [ // type 0 — top row
        ['....XXX....','...XXXXX...','..XXXXXXX..','..XX.X.XX..',
         '..XXXXXXX..','...X.X.X...','..X.X.X.X..','...X...X...'],
        ['....XXX....','...XXXXX...','..XXXXXXX..','..XX.X.XX..',
         '..XXXXXXX..','...X.X.X...','..X.....X..','.X.......X.']
      ],
      [ // type 1 — middle rows
        ['..X.....X..','...X...X...','..XXXXXXX..','.XX.XXX.XX.',
         'XXXXXXXXXXX','X.XXXXXXX.X','X.X.....X.X','...XX.XX...'],
        ['..X.....X..','X..X...X..X','X.XXXXXXX.X','XXX.XXX.XXX',
         'XXXXXXXXXXX','.XXXXXXXXX.','..X.....X..','.X.......X.']
      ],
      [ // type 2 — bottom rows
        ['...XXXXX...','.XXXXXXXXX.','XXXXXXXXXXX','XXX.XXX.XXX',
         'XXXXXXXXXXX','..XX.X.XX..','.XX.XXX.XX.','XX.......XX'],
        ['...XXXXX...','.XXXXXXXXX.','XXXXXXXXXXX','XXX.XXX.XXX',
         'XXXXXXXXXXX','...XX.XX...','..XX.X.XX..','.X.X...X.X.']
      ]
    ];

    var PIXEL = 2.6; // world units per sprite pixel

    function drawSprite(rows, cx, cy, color, px) {
      px = px || PIXEL;
      var x0 = cx - (rows[0].length * px) / 2;
      var y0 = cy - (rows.length * px) / 2;
      ctx.fillStyle = color;
      for (var r = 0; r < rows.length; r++) {
        var row = rows[r], runStart = -1;
        for (var c = 0; c <= row.length; c++) {
          var on = c < row.length && row[c] !== '.';
          if (on && runStart < 0) runStart = c;
          if (!on && runStart >= 0) {
            ctx.fillRect(x0 + runStart * px, y0 + r * px, (c - runStart) * px, px);
            runStart = -1;
          }
        }
      }
    }

    /* ======================================================================
       RENDER
       ====================================================================== */
    var varCache = {};
    function getVar(name) {
      if (!varCache[name]) {
        varCache[name] = getComputedStyle(document.documentElement)
          .getPropertyValue(name).trim();
      }
      return varCache[name];
    }
    function charColor() {
      return game.state.character === 'volume' ? getVar('--volume') : getVar('--precision');
    }
    var INVADER_COLORS = ['--cyan', '--green', '--amber'];

    function render() {
      var s = game.state;
      var j;

      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.fillStyle = getVar('--bg');
      ctx.fillRect(0, 0, view.cssW, view.cssH);

      ctx.setTransform(
        view.dpr * view.scale, 0, 0, view.dpr * view.scale,
        view.dpr * view.offX,  view.dpr * view.offY
      );

      ctx.fillStyle = getVar('--field');
      ctx.fillRect(0, 0, W, H);

      // Faint grid, so movement has something to read against.
      ctx.strokeStyle = getVar('--grid');
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var gx = 0; gx <= W; gx += 40) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
      for (var gy = 0; gy <= H; gy += 40) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
      ctx.stroke();

      // The line invaders must not cross.
      ctx.strokeStyle = 'rgba(255,194,71,0.30)';
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, CI.bottomLine);
      ctx.lineTo(W, CI.bottomLine);
      ctx.stroke();
      ctx.setLineDash([]);

      // Invaders.
      for (j = 0; j < s.invaders.length; j++) {
        var inv = s.invaders[j];
        if (!inv.alive) continue;
        drawSprite(
          INVADERS[inv.type][s.formation.frame],
          Math.round(inv.x), Math.round(inv.y),
          getVar(INVADER_COLORS[inv.type])
        );
      }

      // Player shots.
      ctx.fillStyle = charColor();
      for (j = 0; j < s.shots.length; j++) {
        var sh = s.shots[j];
        if (sh.active) ctx.fillRect(Math.round(sh.x) - 1.5, Math.round(sh.y) - 5, 3, 10);
      }

      // SPAM LIKELY — drawn over the shots, so you can see them being eaten.
      for (j = 0; j < s.blockers.length; j++) {
        var bl = s.blockers[j];
        if (!bl.active) continue;
        var bx = Math.round(bl.x - bl.halfWidth);
        var by = Math.round(bl.y - bl.halfHeight);
        var bw = Math.round(bl.halfWidth * 2);
        var bh = Math.round(bl.halfHeight * 2);

        ctx.fillStyle = '#e9edf2';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = '#0b0f14';
        ctx.fillRect(bx + 2, by + 2, bw - 4, 2);
        ctx.fillRect(bx + 2, by + bh - 4, bw - 4, 2);

        ctx.fillStyle = '#0b0f14';
        ctx.font = 'bold 15px ui-monospace, Menlo, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('SPAM LIKELY', bl.x, bl.y + 1);
        ctx.textBaseline = 'top';
      }

      // Enemy shots.
      ctx.fillStyle = getVar('--bone');
      for (j = 0; j < s.enemyShots.length; j++) {
        var eb = s.enemyShots[j];
        if (eb.active) ctx.fillRect(Math.round(eb.x) - 1.5, Math.round(eb.y) - 6, 3, 12);
      }

      // Ship — blinks while stunned.
      var stunned = s.stun > 0;
      if (!stunned || Math.floor(s.elapsed * 14) % 2 === 0) {
        drawSprite(
          s.character === 'volume' ? SHIP_VOLUME : SHIP_PRECISION,
          Math.round(s.ship.x), Math.round(s.ship.y), charColor()
        );
      }

      // Hit flash.
      if (s.flashHit > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.30 * (s.flashHit / 0.35)).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
      }

      // HUD.
      ctx.fillStyle = getVar('--amber');
      ctx.font = '13px ui-monospace, Menlo, monospace';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillText('SCORE ' + String(s.score).padStart(5, '0'), 10, 10);
      ctx.textAlign = 'right';
      ctx.fillText('LIVES ' + Math.max(0, s.lives), W - 10, 10);
      ctx.textAlign = 'center';
      ctx.fillStyle = charColor();
      ctx.fillText(s.character.toUpperCase(), W / 2, 10);

      // End state — temporary until Phase 6.
      if (s.phase !== 'playing') {
        ctx.fillStyle = 'rgba(7,8,12,0.82)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = s.phase === 'won' ? getVar('--green') : getVar('--precision');
        ctx.font = '30px ui-monospace, Menlo, monospace';
        ctx.fillText(s.phase === 'won' ? 'CLEARED' : 'OVERRUN', W / 2, H / 2 - 30);
        ctx.fillStyle = getVar('--amber');
        ctx.font = '13px ui-monospace, Menlo, monospace';
        ctx.fillText('SCORE ' + s.score + '   ' + s.elapsed.toFixed(1) + 's', W / 2, H / 2 + 6);
        ctx.fillStyle = getVar('--dim');
        ctx.font = '11px ui-monospace, Menlo, monospace';
        ctx.fillText(s.lossReason ? 'reason: ' + s.lossReason : 'grid cleared', W / 2, H / 2 + 28);
        ctx.fillText('tap to play again', W / 2, H / 2 + 50);
        ctx.textBaseline = 'top';
      }

      // Dev readout — goes away in Phase 6.
      ctx.fillStyle = getVar('--dim');
      ctx.font = '10px ui-monospace, Menlo, monospace';
      ctx.textAlign = 'left';
      ctx.fillText('seed ' + seedLabel + '   left ' + s.aliveCount, 10, H - 30);
      ctx.fillText('t ' + s.elapsed.toFixed(1) + 's   ' + fps + 'fps   shots ' +
                   s.stats.shotsFired + '/' + s.stats.shotsHit +
                   '   blocked ' + s.stats.shotsAbsorbed, 10, H - 18);
      ctx.textAlign = 'right';
      ctx.fillText('phase 5 — spam likely', W - 10, H - 18);

      // Scanlines over the top, for the CRT read.
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      for (var y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

      // Mask anything that strayed outside the playfield.
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.fillStyle = getVar('--bg');
      if (view.offX > 0) {
        ctx.fillRect(0, 0, view.offX, view.cssH);
        ctx.fillRect(view.cssW - view.offX - 1, 0, view.offX + 1, view.cssH);
      }
      if (view.offY > 0) {
        ctx.fillRect(0, 0, view.cssW, view.offY);
        ctx.fillRect(0, view.cssH - view.offY - 1, view.cssW, view.offY + 1);
      }
    }

    /* ======================================================================
       FIXED-TIMESTEP LOOP

       Game logic advances in exact 1/120s increments no matter what the
       display does. A 120Hz phone takes one step per frame, a 60Hz screen
       takes two, and both produce the identical round.
       ====================================================================== */
    var accumulator = 0;
    var lastTime = 0;
    var fps = 0, fpsFrames = 0, fpsClock = 0;
    var MAX_STEPS_PER_FRAME = 300;

    function frame(now) {
      requestAnimationFrame(frame);

      if (!lastTime) { lastTime = now; return; }
      var delta = (now - lastTime) / 1000;
      lastTime = now;
      if (delta > 0.25) delta = 0.25;   // a backgrounded tab must not fast-forward

      if (keyLeft)  game.nudgeTarget(-KEY_SPEED * delta);
      if (keyRight) game.nudgeTarget( KEY_SPEED * delta);

      accumulator += delta;
      var steps = 0;
      while (accumulator >= STEP && steps < MAX_STEPS_PER_FRAME) {
        game.step(STEP);
        accumulator -= STEP;
        steps++;
      }
      if (steps >= MAX_STEPS_PER_FRAME) accumulator = 0;

      fpsFrames++; fpsClock += delta;
      if (fpsClock >= 0.5) { fps = Math.round(fpsFrames / fpsClock); fpsFrames = 0; fpsClock = 0; }

      render();
    }

    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
