<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080c">
<title>Precision vs. Volume</title>
<style>
  :root {
    --bg:        #07080c;   /* cabinet black */
    --field:     #0b0f14;   /* inside the screen */
    --grid:      #131a22;
    --amber:     #ffc247;
    --green:     #46e07a;
    --cyan:      #8be9ff;
    --precision: #ff2b3d;   /* bright red — sharp, engineered */
    --volume:    #b44cff;   /* bright purple — bubbly, cheap */
    --dim:       #4e5a68;
    --bone:      #c9d4e0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--amber);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    position: fixed; inset: 0;
  }

  #stage {
    position: absolute; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: block;
  }

  canvas {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;          /* no scroll, no pinch-zoom, no double-tap zoom */
    image-rendering: pixelated;
  }

  /* ---- The screens either side of the game -------------------------------
     Real HTML rather than canvas, so the keyboard, autofill and the score
     list all behave the way a phone expects. Styled to match the cabinet. */
  .panel {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    padding: calc(env(safe-area-inset-top) + 26px) 22px
             calc(env(safe-area-inset-bottom) + 26px);
    background:
      radial-gradient(ellipse at 50% 38%, #10161d 0%, #07080c 72%);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    text-align: center;
    z-index: 5;
  }
  .panel.on { display: flex; }

  .panel h1 {
    margin: 4px 0 0;
    font-size: 21px;
    letter-spacing: 1px;
    color: var(--amber);
    text-shadow: 0 0 14px rgba(255,194,71,0.45);
  }
  .panel h1 .p { color: var(--precision); text-shadow: 0 0 14px rgba(255,43,61,0.5); }
  .panel h1 .v { color: var(--volume);    text-shadow: 0 0 14px rgba(180,76,255,0.5); }
  .panel h1 .vs { color: var(--dim); font-size: 13px; text-shadow: none; }

  .lead { margin: 0; font-size: 11px; letter-spacing: 2px; color: var(--dim); }
  .who  { margin: 0; font-size: 24px; color: var(--green);
          text-shadow: 0 0 14px rgba(70,224,122,0.45); word-break: break-word; }

  form { width: 100%; max-width: 330px; display: flex; flex-direction: column; gap: 11px; }

  label {
    display: flex; flex-direction: column; gap: 5px;
    text-align: left; font-size: 10px; letter-spacing: 1.4px; color: var(--amber);
  }
  label .hint {
    display: block; font-size: 9px; letter-spacing: 0.6px;
    color: var(--dim); text-transform: none; margin-top: -2px;
  }
  input {
    font: 16px/1.2 ui-monospace, Menlo, Consolas, monospace;  /* 16px: no iOS zoom */
    color: #e9edf2;
    background: #0b0f14;
    border: 1px solid #22303d;
    border-radius: 0;
    padding: 11px 12px;
    width: 100%;
    -webkit-appearance: none;
    touch-action: manipulation;
  }
  input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }

  button {
    font: bold 13px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 0;
    touch-action: manipulation;
  }
  .primary {
    width: 100%; max-width: 330px;
    padding: 15px 16px;
    color: #07080c;
    background: var(--amber);
    border: none;
  }
  .primary:disabled { opacity: 0.5; }
  .link {
    background: none; border: 1px solid #22303d; color: var(--amber);
    padding: 12px 18px; width: 100%; max-width: 330px;
  }
  .err { margin: 0; min-height: 14px; font-size: 11px; color: var(--precision); }

  ol.scores { list-style: none; margin: 4px 0 0; padding: 0; width: 100%; max-width: 360px; }
  ol.scores li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 4px;
    border-bottom: 1px solid rgba(78,90,104,0.26);
    font-size: 13px;
  }
  ol.scores .rank  { width: 24px; text-align: right; color: var(--dim); font-size: 11px; }
  ol.scores .name  { flex: 1; text-align: left; color: #e9edf2;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.scores .side  { font-size: 9px; letter-spacing: 1px; padding: 3px 6px; border: 1px solid; }
  ol.scores .side.precision { color: var(--precision); border-color: var(--precision); }
  ol.scores .side.volume    { color: var(--volume);    border-color: var(--volume); }
  ol.scores .val   { width: 58px; text-align: right; color: var(--amber); }
  ol.scores .empty { justify-content: center; color: var(--dim); font-size: 11px; border: none; }
  .spacer { flex: 1 1 auto; min-height: 8px; }
</style>
</head>
<body>
  <div id="stage"><canvas id="screen"></canvas></div>

  <!-- Sign-in. Shown to anyone this phone has not seen before. -->
  <section id="gate" class="panel">
    <h1><span class="p">PRECISION</span> <span class="vs">vs.</span> <span class="v">VOLUME</span></h1>
    <p class="lead">ENTER THE ARCADE</p>
    <form id="gateForm" novalidate>
      <label>PLAYER NAME
        <span class="hint">this is what shows on the high score board</span>
        <input id="fPlayer" maxlength="20" autocomplete="nickname" autocapitalize="characters" required>
      </label>
      <label>YOUR NAME
        <input id="fName" maxlength="80" autocomplete="name" required>
      </label>
      <label>COMPANY
        <input id="fCompany" maxlength="80" autocomplete="organization" required>
      </label>
      <label>EMAIL
        <input id="fEmail" type="email" inputmode="email" maxlength="200"
               autocomplete="email" autocapitalize="off" spellcheck="false" required>
      </label>
      <p class="err" id="gateError"></p>
      <button type="submit" class="primary" id="gateGo">CONTINUE</button>
    </form>
    <button class="link" data-go="scores">VIEW HIGH SCORES</button>
    <div class="spacer"></div>
  </section>

  <!-- Returning player. This phone has been here before. -->
  <section id="welcome" class="panel">
    <h1><span class="p">PRECISION</span> <span class="vs">vs.</span> <span class="v">VOLUME</span></h1>
    <p class="lead">WELCOME BACK</p>
    <p class="who" id="welcomeName"></p>
    <div class="spacer"></div>
    <button class="primary" data-go="select">START A NEW GAME</button>
    <button class="link" data-go="scores">HIGH SCORES</button>
    <div class="spacer"></div>
  </section>

  <!-- High scores. Open to anyone, signed in or not. -->
  <section id="scores" class="panel">
    <h1>HIGH SCORES</h1>
    <p class="lead">TOP 10</p>
    <ol class="scores" id="scoreList"></ol>
    <div class="spacer"></div>
    <button class="primary" id="scoresBack">START A NEW GAME</button>
  </section>

  <script src="game.js"></script>
  <script>
  (function () {
    'use strict';

    /* ======================================================================
       PHASE 6 — the shell.
       Character select, the round itself, end screens, replay.

       This file is the RENDERER and the SHELL only. Every game rule lives in
       game.js, so the headless tuning harness runs identical logic.
       ====================================================================== */

    var W = PVV.WORLD.w, H = PVV.WORLD.h;
    var STEP = PVV.STEP;
    var CI = PVV.CONFIG.invaders;

    /* ---- URL params -------------------------------------------------------
       ?seed=123     reproduce an exact round
       ?char=volume  skip straight past the select screen
       ?debug=1      show the seed and shot counters while playing
       -------------------------------------------------------------------- */
    var params = new URLSearchParams(location.search);
    var seedParam = params.get('seed');
    var charParam = params.get('char');
    var debug = params.get('debug') === '1';

    var CHARACTERS = [
      {
        id: 'precision',
        name: 'PRECISION',
        tagline: 'FIRES RARELY. RARELY MISSES.',
        blurb: ['A slow, deliberate cadence.', 'Every shot is chosen.'],
        colorVar: '--precision'
      },
      {
        id: 'volume',
        name: 'VOLUME',
        tagline: 'NEVER STOPS FIRING.',
        blurb: ['Ten times the shots.', 'Out-work the whole grid.'],
        colorVar: '--volume'
      }
    ];

    var screen = 'boot';   // 'boot' | 'ui' | 'select' | 'play' | 'end'
    var game = null;
    var seedLabel = '';
    var selectClock = 0;
    var endClock = 0;

    /* ======================================================================
       WHO IS PLAYING, AND THE SCORE BOARD

       The phone remembers a token after someone signs in once. On the next
       visit that token is all it takes to be recognised, so nobody types
       their email twice.

       If there is no server behind this — opened straight off the disk, say —
       everything below quietly stands down and the game goes straight to
       character select.
       ====================================================================== */
    var TOKEN_KEY = 'pvv.token';
    var player = { token: null, name: null };
    var online = true;
    var submitted = false;

    function readToken() {
      try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
    }
    function writeToken(t) {
      try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {}
    }

    function api(path, options) {
      return fetch(path, options).then(function (r) {
        return r.text().then(function (raw) {
          var body = null;
          try { body = raw ? JSON.parse(raw) : null; } catch (e) { /* not JSON */ }
          // Never show a raw parser message to someone at a conference stand.
          if (!r.ok)  throw new Error((body && body.error) || 'Something went wrong. Try again.');
          if (!body)  throw new Error('Something went wrong. Try again.');
          return body;
        });
      });
    }

    var panels = {
      gate:    document.getElementById('gate'),
      welcome: document.getElementById('welcome'),
      scores:  document.getElementById('scores')
    };

    function showPanel(name) {
      for (var k in panels) panels[k].classList.toggle('on', k === name);
      screen = name ? 'ui' : screen;
      if (name === 'scores') {
        loadScores();
        // Where "back" goes depends on whether we know this person yet.
        document.getElementById('scoresBack').textContent =
          player.token ? 'START A NEW GAME' : 'ENTER AND PLAY';
      }
      if (name === 'welcome') {
        document.getElementById('welcomeName').textContent = player.name || '';
      }
    }

    function hidePanels() {
      for (var k in panels) panels[k].classList.remove('on');
    }

    /* The button at the bottom of the high scores page. Someone we already
       know goes straight into a new game; someone we do not goes to the form,
       because that is the only way back in. */
    function leaveScores() {
      if (!online || player.token) { toSelect(); return; }
      showPanel('gate');
    }

    function toSelect() {
      hidePanels();
      screen = 'select';
      selectClock = 0;
      hoverCard = -1;
      lastTime = 0;
    }

    function loadScores() {
      var list = document.getElementById('scoreList');
      list.innerHTML = '<li class="empty">loading…</li>';
      api('/api/scores').then(function (data) {
        var rows = data.scores || [];
        if (!rows.length) { list.innerHTML = '<li class="empty">no scores yet — be the first</li>'; return; }
        list.innerHTML = '';
        rows.forEach(function (row, i) {
          var li = document.createElement('li');
          var side = row.side === 'volume' ? 'volume' : 'precision';
          li.innerHTML =
            '<span class="rank">' + (i + 1) + '</span>' +
            '<span class="name"></span>' +
            '<span class="side ' + side + '">' + side.toUpperCase() + '</span>' +
            '<span class="val">' + row.score + '</span>';
          li.querySelector('.name').textContent = row.playerName;
          list.appendChild(li);
        });
      }).catch(function () {
        list.innerHTML = '<li class="empty">could not load the board</li>';
      });
    }

    function submitScore() {
      if (!online || !player.token || submitted || !game) return;
      submitted = true;
      var st = game.state;
      api('/api/score', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          token: player.token,
          side: st.character,
          score: st.score,
          seconds: st.elapsed,
          won: st.phase === 'won',
          invadersLeft: st.aliveCount,
          shotsFired: st.stats.shotsFired,
          shotsHit: st.stats.shotsHit,
          shotsBlocked: st.stats.shotsAbsorbed
        })
      }).catch(function () {});
    }

    /* ---- wiring ---------------------------------------------------------- */
    document.addEventListener('click', function (e) {
      var go = e.target.getAttribute && e.target.getAttribute('data-go');
      if (!go) return;
      if (go === 'select') toSelect();
      else showPanel(go);
    });

    document.getElementById('scoresBack').addEventListener('click', leaveScores);

    document.getElementById('gateForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = document.getElementById('gateGo');
      var err = document.getElementById('gateError');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'ONE MOMENT…';
      api('/api/register', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          playerName: document.getElementById('fPlayer').value,
          fullName:   document.getElementById('fName').value,
          company:    document.getElementById('fCompany').value,
          email:      document.getElementById('fEmail').value
        })
      }).then(function (data) {
        player.token = data.token;
        player.name = data.playerName;
        writeToken(data.token);
        toSelect();
      }).catch(function (e2) {
        err.textContent = e2.message || 'Something went wrong.';
      }).then(function () {
        btn.disabled = false;
        btn.textContent = 'CONTINUE';
      });
    });

    /* ---- boot ------------------------------------------------------------ */
    function boot() {
      var token = readToken();
      api('/api/me?token=' + encodeURIComponent(token || '')).then(function (data) {
        online = true;
        if (data.known) { player.token = token; player.name = data.playerName; showPanel('welcome'); }
        else { showPanel('gate'); }
      }).catch(function () {
        online = false;          // no server: just play
        toSelect();
      });
    }

    function startRound(characterId) {
      var seed = seedParam != null ? seedParam : String(Date.now());
      seedLabel = String(seed);
      game = PVV.createGame({ character: characterId, seed: seed });
      hidePanels();
      screen = 'play';
      accumulator = 0;
      submitted = false;
    }

    function backToSelect() {
      screen = 'select';
      game = null;
      selectClock = 0;
      hoverCard = -1;
    }

    /* Two tappable buttons on the end card. */
    function endButtons() {
      var bw = 210, bx = (W - bw) / 2;
      var list = [{ x: bx, y: H - 168, w: bw, h: 38, act: 'again', label: 'PLAY AGAIN' }];
      if (online) list.push({ x: bx, y: H - 118, w: bw, h: 38, act: 'scores', label: 'HIGH SCORES' });
      return list;
    }

    /* ======================================================================
       CANVAS + DEVICE PIXEL RATIO
       ====================================================================== */
    var canvas = document.getElementById('screen');
    var ctx = canvas.getContext('2d', { alpha: false });
    var view = { scale: 1, offX: 0, offY: 0, cssW: 0, cssH: 0, dpr: 1 };

    function resize() {
      var rect = canvas.getBoundingClientRect();
      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      var cssW = Math.max(1, Math.round(rect.width));
      var cssH = Math.max(1, Math.round(rect.height));
      canvas.width  = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      var scale = Math.min(cssW / W, cssH / H);
      view.scale = scale;
      view.offX = (cssW - W * scale) / 2;
      view.offY = (cssH - H * scale) / 2;
      view.cssW = cssW; view.cssH = cssH; view.dpr = dpr;
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    resize();

    function toWorld(clientX, clientY) {
      var rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left - view.offX) / view.scale,
        y: (clientY - rect.top  - view.offY) / view.scale
      };
    }

    /* ======================================================================
       SELECT-SCREEN LAYOUT (world units) — shared by drawing and hit-testing
       ====================================================================== */
    var CARD = { x: 26, w: W - 52, h: 150, y0: 212, gap: 26 };
    function cardRect(i) {
      return { x: CARD.x, y: CARD.y0 + i * (CARD.h + CARD.gap), w: CARD.w, h: CARD.h };
    }
    function cardAt(p) {
      for (var i = 0; i < CHARACTERS.length; i++) {
        var r = cardRect(i);
        if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return i;
      }
      return -1;
    }
    var hoverCard = -1;

    /* ======================================================================
       INPUT — Pointer Events only. One code path for touch, pen and mouse.
       ====================================================================== */
    var pointerActive = false, activePointerId = null;

    function handlePress(p) {
      if (screen === 'select') {
        var i = cardAt(p);
        if (i >= 0) startRound(CHARACTERS[i].id);
        return true;
      }
      if (screen === 'end' && endClock > 0.5) {
        var btns = endButtons();
        for (var b = 0; b < btns.length; b++) {
          var r = btns[b];
          if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
            if (r.act === 'again') backToSelect(); else showPanel('scores');
            return true;
          }
        }
        return true;   // swallow taps on the card itself
      }
      return false;
    }

    canvas.addEventListener('pointerdown', function (e) {
      var p = toWorld(e.clientX, e.clientY);
      pointerActive = true;
      activePointerId = e.pointerId;
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (!handlePress(p) && screen === 'play') game.setTargetX(p.x);
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('pointermove', function (e) {
      var p = toWorld(e.clientX, e.clientY);
      if (screen === 'select') { hoverCard = cardAt(p); return; }
      if (screen !== 'play') return;
      if (pointerActive && e.pointerId === activePointerId) game.setTargetX(p.x);
      else if (e.pointerType === 'mouse') game.setTargetX(p.x);   // desktop: follow the mouse
      e.preventDefault();
    }, { passive: false });

    function endPointer(e) {
      if (e.pointerId === activePointerId) { pointerActive = false; activePointerId = null; }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    /* Desktop convenience only — the game is designed for drag. */
    var keyLeft = false, keyRight = false;
    var KEY_SPEED = 320;
    window.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keyLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = true;
      if (e.key === '1' && screen === 'select') startRound('precision');
      if (e.key === '2' && screen === 'select') startRound('volume');
      if ((e.key === ' ' || e.key === 'Enter') && screen === 'end' && endClock > 0.7) backToSelect();
      if (e.key === 'Escape' && screen !== 'select') backToSelect();
    });
    window.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') keyLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = false;
    });

    /* Belt and braces against mobile browser gestures. */
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
      document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    /* ======================================================================
       PIXEL SPRITES — 11 x 8 cells
       ====================================================================== */
    var SHIP_PRECISION = [
      '.....X.....','....XXX....','....XXX....','...XXXXX...',
      '..XXXXXXX..','.XXXXXXXXX.','XX.XXXXX.XX','X...XXX...X'
    ];
    var SHIP_VOLUME = [
      '...XX.XX...','..XXXXXXX..','.XXXXXXXXXX','XXXXXXXXXXX',
      'XXXXXXXXXXX','.XXXXXXXXX.','..XX.X.XX..','..X.....X..'
    ];
    var SHIPS = { precision: SHIP_PRECISION, volume: SHIP_VOLUME };

    // Little pennant, repeated along the SPAM LIKELY bar.
    var FLAG = [
      'X......',
      'XXXXX..',
      'XXXXXXX',
      'XXXXXX.',
      'XXXX...',
      'X......',
      'X......',
      'X......'
    ];

    // The NEW NUMBER handset.
    var PHONE = [
      '..XXXXXXX..',
      '.XX.....XX.',
      'XX.......XX',
      'XX.......XX',
      'XX.XXXXX.XX',
      'XXXX...XXXX',
      'XXX.....XXX',
      '.X.......X.',
      '..XXXXXXX..',
      '...XXXXX...',
      '....XXX....'
    ];

    var INVADERS = [
      [['....XXX....','...XXXXX...','..XXXXXXX..','..XX.X.XX..',
        '..XXXXXXX..','...X.X.X...','..X.X.X.X..','...X...X...'],
       ['....XXX....','...XXXXX...','..XXXXXXX..','..XX.X.XX..',
        '..XXXXXXX..','...X.X.X...','..X.....X..','.X.......X.']],
      [['..X.....X..','...X...X...','..XXXXXXX..','.XX.XXX.XX.',
        'XXXXXXXXXXX','X.XXXXXXX.X','X.X.....X.X','...XX.XX...'],
       ['..X.....X..','X..X...X..X','X.XXXXXXX.X','XXX.XXX.XXX',
        'XXXXXXXXXXX','.XXXXXXXXX.','..X.....X..','.X.......X.']],
      [['...XXXXX...','.XXXXXXXXX.','XXXXXXXXXXX','XXX.XXX.XXX',
        'XXXXXXXXXXX','..XX.X.XX..','.XX.XXX.XX.','XX.......XX'],
       ['...XXXXX...','.XXXXXXXXX.','XXXXXXXXXXX','XXX.XXX.XXX',
        'XXXXXXXXXXX','...XX.XX...','..XX.X.XX..','.X.X...X.X.']]
    ];

    var PIXEL = 2.6;

    function drawSprite(rows, cx, cy, color, px) {
      px = px || PIXEL;
      var x0 = cx - (rows[0].length * px) / 2;
      var y0 = cy - (rows.length * px) / 2;
      ctx.fillStyle = color;
      for (var r = 0; r < rows.length; r++) {
        var row = rows[r], runStart = -1;
        for (var c = 0; c <= row.length; c++) {
          var on = c < row.length && row[c] !== '.';
          if (on && runStart < 0) runStart = c;
          if (!on && runStart >= 0) {
            ctx.fillRect(x0 + runStart * px, y0 + r * px, (c - runStart) * px, px);
            runStart = -1;
          }
        }
      }
    }

    /* ======================================================================
       DRAWING HELPERS
       ====================================================================== */
    var varCache = {};
    function getVar(name) {
      if (!varCache[name]) {
        varCache[name] = getComputedStyle(document.documentElement)
          .getPropertyValue(name).trim();
      }
      return varCache[name];
    }
    var INVADER_COLORS = ['--cyan', '--green', '--amber'];

    function text(str, x, y, size, color, align, glow) {
      ctx.font = (size >= 15 ? 'bold ' : '') + size + 'px ui-monospace, Menlo, monospace';
      ctx.textAlign = align || 'center';
      ctx.fillStyle = color;
      if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
      ctx.fillText(str, x, y);
      ctx.shadowBlur = 0;
    }

    function beginField() {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.fillStyle = getVar('--bg');
      ctx.fillRect(0, 0, view.cssW, view.cssH);
      ctx.setTransform(
        view.dpr * view.scale, 0, 0, view.dpr * view.scale,
        view.dpr * view.offX,  view.dpr * view.offY
      );
      ctx.fillStyle = getVar('--field');
      ctx.fillRect(0, 0, W, H);
      ctx.textBaseline = 'middle';
    }

    function endField() {
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      for (var y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

      var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.30, W / 2, H / 2, H * 0.74);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.fillStyle = getVar('--bg');
      if (view.offX > 0) {
        ctx.fillRect(0, 0, view.offX, view.cssH);
        ctx.fillRect(view.cssW - view.offX - 1, 0, view.offX + 1, view.cssH);
      }
      if (view.offY > 0) {
        ctx.fillRect(0, 0, view.cssW, view.offY);
        ctx.fillRect(0, view.cssH - view.offY - 1, view.cssW, view.offY + 1);
      }
    }

    /* ======================================================================
       SELECT SCREEN
       ====================================================================== */
    function renderSelect() {
      beginField();

      var drift = Math.sin(selectClock * 0.55);
      var animFrame = Math.floor(selectClock * 1.6) % 2;
      for (var r = 0; r < 2; r++) {
        for (var c = 0; c < 7; c++) {
          ctx.globalAlpha = 0.16;
          drawSprite(INVADERS[r][animFrame], 60 + c * 40 + drift * 14, 50 + r * 30,
                     getVar(INVADER_COLORS[r]), 2.2);
          ctx.globalAlpha = 1;
        }
      }

      text('PRECISION', W / 2, 138, 26, getVar('--precision'), 'center', 12);
      text('vs.',       W / 2, 164, 12, getVar('--dim'));
      text('VOLUME',    W / 2, 190, 26, getVar('--volume'), 'center', 12);

      for (var i = 0; i < CHARACTERS.length; i++) {
        var ch = CHARACTERS[i];
        var rect = cardRect(i);
        var col = getVar(ch.colorVar);
        var hot = hoverCard === i;

        ctx.fillStyle = hot ? 'rgba(255,255,255,0.055)' : 'rgba(255,255,255,0.025)';
        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        ctx.strokeStyle = col;
        ctx.globalAlpha = hot ? 1 : 0.5;
        ctx.lineWidth = hot ? 2 : 1;
        ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
        ctx.globalAlpha = 1;

        var bob = Math.sin(selectClock * 2.2 + i * 1.7) * 3;
        drawSprite(SHIPS[ch.id], rect.x + 48, rect.y + rect.h / 2 + bob, col, 3.2);

        var tx = rect.x + 96;
        text(ch.name,     tx, rect.y + 42,  19, col, 'left', hot ? 10 : 0);
        text(ch.tagline,  tx, rect.y + 68,  9,  getVar('--amber'), 'left');
        text(ch.blurb[0], tx, rect.y + 94,  9,  getVar('--dim'), 'left');
        text(ch.blurb[1], tx, rect.y + 110, 9,  getVar('--dim'), 'left');
      }

      var pulse = 0.5 + 0.5 * Math.sin(selectClock * 3);
      ctx.globalAlpha = 0.45 + 0.55 * pulse;
      text('TAP A SIDE TO BEGIN', W / 2, H - 76, 12, getVar('--amber'));
      ctx.globalAlpha = 1;
      text('drag anywhere to move  ·  firing is automatic', W / 2, H - 54, 8.5, getVar('--dim'));

      endField();
    }

    /* ======================================================================
       PLAY SCREEN
       ====================================================================== */
    function renderPlay() {
      var s = game.state;
      var j;
      beginField();

      ctx.strokeStyle = getVar('--grid');
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var gx = 0; gx <= W; gx += 40) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
      for (var gy = 0; gy <= H; gy += 40) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,194,71,0.30)';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, CI.bottomLine); ctx.lineTo(W, CI.bottomLine);
      ctx.stroke();
      ctx.setLineDash([]);

      for (j = 0; j < s.invaders.length; j++) {
        var inv = s.invaders[j];
        if (!inv.alive) continue;
        drawSprite(INVADERS[inv.type][s.formation.frame],
                   Math.round(inv.x), Math.round(inv.y),
                   getVar(INVADER_COLORS[inv.type]));
      }

      var col = getVar(s.character === 'volume' ? '--volume' : '--precision');

      ctx.fillStyle = col;
      for (j = 0; j < s.shots.length; j++) {
        var sh = s.shots[j];
        if (sh.active) ctx.fillRect(Math.round(sh.x) - 1.5, Math.round(sh.y) - 5, 3, 10);
      }

      /* SPAM LIKELY — drawn over the shots, so you see them being eaten. */
      for (j = 0; j < s.blockers.length; j++) {
        var bl = s.blockers[j];
        if (!bl.active) continue;
        var bx = Math.round(bl.x - bl.halfWidth), by = Math.round(bl.y - bl.halfHeight);
        var bw = Math.round(bl.halfWidth * 2),    bh = Math.round(bl.halfHeight * 2);
        ctx.fillStyle = '#e9edf2';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = '#0b0f14';
        ctx.fillRect(bx + 2, by + 2, bw - 4, 2);
        ctx.fillRect(bx + 2, by + bh - 4, bw - 4, 2);

        // Flags along both ends of the bar.
        var flagCount = 3;
        for (var f = 0; f < flagCount; f++) {
          var fy = bl.y;
          drawSprite(FLAG, bx + 12 + f * 15, fy, '#d0212f', 1.5);
          drawSprite(FLAG, bx + bw - 12 - f * 15, fy, '#d0212f', 1.5);
        }
        text('SPAM LIKELY', bl.x, bl.y + 1, 15, '#0b0f14');
      }

      /* NEW NUMBER handset — sits at the ship's own level, so it has to be
         driven into rather than shot. */
      if (s.pickup.active) {
        var pb = Math.sin(s.pickup.bob * 4) * 3;
        var ring = 0.5 + 0.5 * Math.sin(s.pickup.bob * 9);
        ctx.globalAlpha = 0.25 + 0.35 * ring;
        ctx.fillStyle = getVar('--green');
        ctx.beginPath();
        ctx.arc(s.pickup.x, s.pickup.y + pb, 20 + ring * 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        drawSprite(PHONE, Math.round(s.pickup.x), Math.round(s.pickup.y + pb),
                   getVar('--green'), 2.4);
        text('NEW NUMBER', s.pickup.x, s.pickup.y - 28, 9, getVar('--green'));
      }

      ctx.fillStyle = getVar('--bone');
      for (j = 0; j < s.enemyShots.length; j++) {
        var eb = s.enemyShots[j];
        if (eb.active) ctx.fillRect(Math.round(eb.x) - 1.5, Math.round(eb.y) - 6, 3, 12);
      }

      var stunned = s.stun > 0;
      if (!stunned || Math.floor(s.elapsed * 14) % 2 === 0) {
        drawSprite(SHIPS[s.character], Math.round(s.ship.x), Math.round(s.ship.y), col);
      }

      if (s.flashHit > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.30 * (s.flashHit / 0.35)).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
      }

      /* Full-screen banner: the bad one flashes, the good one glows steady. */
      if (s.banner.left > 0) {
        var bad = s.banner.tone === 'bad';
        var bcol = bad ? '#ff2b3d' : getVar('--green');
        var t = s.banner.left / s.banner.total;
        var show = bad ? (Math.floor(s.banner.left * 9) % 2 === 0) : true;
        ctx.fillStyle = bad
          ? 'rgba(80,0,8,' + (0.38 * t).toFixed(3) + ')'
          : 'rgba(0,60,24,' + (0.34 * t).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
        if (show) {
          var by2 = H * 0.36;
          ctx.fillStyle = 'rgba(7,8,12,0.82)';
          ctx.fillRect(0, by2 - 30, W, 60);
          ctx.strokeStyle = bcol;
          ctx.lineWidth = 2;
          ctx.strokeRect(0, by2 - 30, W, 60);
          text(s.banner.text, W / 2, by2, bad ? 19 : 18, bcol, 'center', 18);
        }
      }

      text('SCORE ' + String(s.score).padStart(5, '0'), 10, 18, 12, getVar('--amber'), 'left');
      text(s.character.toUpperCase(), W / 2, 18, 12, col);
      for (var l = 0; l < Math.max(0, s.lives); l++) {
        drawSprite(SHIPS[s.character], W - 16 - l * 20, 18, col, 1.5);
      }

      if (debug) {
        text('seed ' + seedLabel + '   left ' + s.aliveCount, 10, H - 26, 9, getVar('--dim'), 'left');
        text('t ' + s.elapsed.toFixed(1) + 's   ' + fps + 'fps   shots ' +
             s.stats.shotsFired + '/' + s.stats.shotsHit +
             '   blocked ' + s.stats.shotsAbsorbed, 10, H - 13, 9, getVar('--dim'), 'left');
      }

      endField();
    }

    /* ======================================================================
       END SCREEN
       ====================================================================== */
    function renderEnd() {
      renderPlay();

      ctx.setTransform(
        view.dpr * view.scale, 0, 0, view.dpr * view.scale,
        view.dpr * view.offX,  view.dpr * view.offY
      );
      ctx.textBaseline = 'middle';

      var s = game.state;
      var won = s.phase === 'won';
      var col = getVar(s.character === 'volume' ? '--volume' : '--precision');
      var fade = Math.min(1, endClock / 0.45);

      ctx.fillStyle = 'rgba(7,8,12,' + (0.9 * fade).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = fade;

      text(won ? 'GRID CLEARED' : 'OVERRUN', W / 2, 178, 27,
           won ? getVar('--green') : getVar('--precision'), 'center', 14);
      text('playing as ' + s.character.toUpperCase(), W / 2, 208, 11, col);

      var hitRate = s.stats.shotsFired
        ? (s.stats.shotsHit / s.stats.shotsFired * 100).toFixed(1) + '%' : '—';

      var rows = [
        ['SCORE',           String(s.score)],
        ['TIME',            s.elapsed.toFixed(1) + 's'],
        ['SHOTS FIRED',     String(s.stats.shotsFired)],
        ['SHOTS CONNECTED', s.stats.shotsHit + '  (' + hitRate + ')']
      ];
      if (s.stats.shotsAbsorbed > 0) rows.push(['BLOCKED BY SPAM', String(s.stats.shotsAbsorbed)]);
      if (!won) rows.push(['INVADERS LEFT', s.aliveCount + ' of ' + s.invaders.length]);

      var y = 266;
      for (var i = 0; i < rows.length; i++) {
        text(rows[i][0], 44,     y, 10, getVar('--dim'),   'left');
        text(rows[i][1], W - 44, y, 12, getVar('--amber'), 'right');
        ctx.strokeStyle = 'rgba(78,90,104,0.26)';
        ctx.beginPath();
        ctx.moveTo(44, y + 14); ctx.lineTo(W - 44, y + 14);
        ctx.stroke();
        y += 32;
      }

      if (endClock > 0.5) {
        var btns = endButtons();
        for (var b = 0; b < btns.length; b++) {
          var r = btns[b];
          var primary = r.act === 'again';
          ctx.fillStyle = primary ? getVar('--amber') : 'rgba(255,255,255,0.04)';
          ctx.fillRect(r.x, r.y, r.w, r.h);
          if (!primary) {
            ctx.strokeStyle = '#22303d'; ctx.lineWidth = 1;
            ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
          }
          text(r.label, r.x + r.w / 2, r.y + r.h / 2 + 1, 12,
               primary ? '#07080c' : getVar('--amber'));
        }
        text('try the other side', W / 2, H - 74, 9, getVar('--dim'));
      }

      ctx.globalAlpha = 1;
      endField();
    }

    /* ======================================================================
       FIXED-TIMESTEP LOOP

       Game logic advances in exact 1/120s increments no matter what the
       display does. A 120Hz phone takes one step per frame, a 60Hz screen
       takes two, and both produce the identical round.
       ====================================================================== */
    var accumulator = 0, lastTime = 0;
    var fps = 0, fpsFrames = 0, fpsClock = 0;
    var MAX_STEPS_PER_FRAME = 300;

    function frame(now) {
      requestAnimationFrame(frame);
      if (!lastTime) { lastTime = now; return; }
      var delta = (now - lastTime) / 1000;
      lastTime = now;
      if (delta > 0.25) delta = 0.25;   // a backgrounded tab must not fast-forward

      fpsFrames++; fpsClock += delta;
      if (fpsClock >= 0.5) { fps = Math.round(fpsFrames / fpsClock); fpsFrames = 0; fpsClock = 0; }

      if (screen === 'boot' || screen === 'ui') return;   // an overlay is up

      if (screen === 'select') {
        selectClock += delta;
        renderSelect();
        return;
      }

      if (screen === 'play') {
        if (keyLeft)  game.nudgeTarget(-KEY_SPEED * delta);
        if (keyRight) game.nudgeTarget( KEY_SPEED * delta);

        accumulator += delta;
        var steps = 0;
        while (accumulator >= STEP && steps < MAX_STEPS_PER_FRAME) {
          game.step(STEP);
          accumulator -= STEP;
          steps++;
        }
        if (steps >= MAX_STEPS_PER_FRAME) accumulator = 0;

        if (game.state.phase !== 'playing') { screen = 'end'; endClock = 0; submitScore(); }
        renderPlay();
        return;
      }

      endClock += delta;
      renderEnd();
    }

    if (charParam === 'volume' || charParam === 'precision') { online = false; startRound(charParam); }
    else boot();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
